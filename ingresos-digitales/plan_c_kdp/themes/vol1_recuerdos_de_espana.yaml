# Vol. 1 "Recuerdos de España" — themes for review by Piero.
# Rules: single words only (3-15 letters), no song lyrics, no brands.
# Words are written with normal Spanish spelling; the generator removes accents
# (keeps Ñ) so the list matches the grid. Edit freely and re-run the build.
book:
  id: vol1
  title: "Sopa de letras para mayores"
