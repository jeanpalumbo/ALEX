# Vol. 2 "Recuerdos de los años 60" — themes for review by Piero.
# Same rules as Vol. 1: single words, no lyrics, no brands. Distinct themes from Vol. 1
# so KDP does not see the two books as near-duplicates.
book:
  id: vol2
  title: "Sopa de letras para mayores"
  subtitle: "Recuerdos de los años 60"
  volume: 2
  author: "Piero Palumbo"
  year: 2026
  cover_word: "SESENTA"
  palette: "teal"
  blurb: >-
    {n} sopas de letras en letra muy grande para volver a los años sesenta: la llegada
    del turismo, los que se fueron a trabajar a Europa, el piso nuevo, la música ye-yé,
    el hombre en la Luna, la tele en blanco y negro y mucho más.
  keywords:
    - "sopa de letras años 60 letra grande"
    - "pasatiempos para mayores letra grande"
    - "regalo para abuelos nostalgia"
    - "libro de actividades para ancianos"
    - "recuerdos de los años sesenta en España"
    - "sopas de letras para adultos mayores"
    - "entretenimiento para la tercera edad"
themes:
