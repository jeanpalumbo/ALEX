# Agenda 2027 para mayores — one seasonal word search per week (Mon 28 Dec 2026 – Sun 2 Jan 2028).
# Each theme has a traditional refrán (public domain) printed on the weekly page.
book:
  id: agenda2027
  title: "Agenda 2027 para mayores"
  subtitle: "Letra grande y una sopa de letras cada semana"
  volume: 2027
  author: "Piero Palumbo"
  year: 2026
  cover_word: "AGENDA"
  palette: "plum"
  blurb: >-
    Una agenda de semana a la vista con letra grande y huecos amplios para apuntar citas,
    y al lado de cada semana una sopa de letras con un tema de esa época del año: los
    Reyes, el Carnaval, la feria, San Juan, la vendimia, las castañas, la Navidad...
  keywords:
    - "agenda 2027 letra grande"
    - "calendario 2027 para personas mayores"
    - "agenda semanal 2027 para mayores"
    - "regalo para abuelos y abuelas"
    - "sopa de letras letra grande para mayores"
    - "planificador 2027 semana vista letra grande"
    - "agenda con pasatiempos y refranes"
  cover:
    line1: "AGENDA 2027"
    line2: "PARA MAYORES"
    tagline: "LETRA MUY GRANDE"
    subline: "Semana a la vista · {n} sopas de letras"
    badge_top: "AÑO"
    badge_bottom: "2027"
    spine: "AGENDA 2027 PARA MAYORES  ·  Letra grande y sopas de letras"
    back_title: "Un año entero, bien organizado"
    bullets:
      - "Semana a la vista en letra grande, con espacio para apuntar."
      - "Una sopa de letras cada semana, con temas de esa época del año."
      - "Festivos nacionales marcados y un refrán para cada semana."
      - "Páginas para datos médicos, teléfonos y cumpleaños."
      - "Formato grande: 21,6 × 27,9 cm."
    closing: "Un regalo práctico para padres y abuelos: les ayuda a recordar sus citas y les acompaña con un pasatiempo cada semana."
  listing:
    title: "Agenda 2027 para mayores en letra grande"
    subtitle: "Semana a la vista con 53 sopas de letras, festivos y refranes. Un regalo para padres y abuelos"
    series: "(sin serie)"
    extra_checks:
      - "Comprobé en el BOE la resolución con los festivos de 2027 (se publica cada otoño) y coinciden con la página de festivos."
      - "Publicarla cuanto antes: la agenda se vende sobre todo de noviembre a enero."
    description_html: |
      <p><b>Una agenda pensada para que nuestros mayores lo tengan todo a mano, en letra bien grande.</b></p>
      <p>Semana a la vista de enero a diciembre de 2027, con días grandes y espacio de sobra para apuntar citas médicas, cumpleaños y recados. Junto a cada semana, una sopa de letras con un tema de esa época del año: los Reyes Magos, el Carnaval, la Semana Santa, San Juan, la vendimia, las castañas, la lotería de Navidad...</p>
      <ul>
      <li>Semana a la vista en letra grande (de lunes a domingo).</li>
      <li>53 sopas de letras de temporada, con soluciones al final.</li>
      <li>Festivos nacionales de 2027 marcados en cada semana.</li>
      <li>Un refrán tradicional para cada semana.</li>
      <li>Páginas para datos personales y médicos, teléfonos importantes y cumpleaños.</li>
      <li>Formato grande: 21,6 × 27,9 cm, en papel blanco.</li>
      </ul>
      <p>El regalo ideal para Navidad: útil todo el año y entretenido cada semana.</p>
themes:
