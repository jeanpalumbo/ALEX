<script type="module">
import * as THREE from "three";
// ============================== utilidades
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, x) => a + (b - a) * x;
const sm = x => { x = cl(x); return x * x * (3 - 2 * x); };
const eout = x => 1 - Math.pow(1 - cl(x), 3);
const ein = x => Math.pow(cl(x), 3);
const back = (x, s = 2) => { x = cl(x) - 1; return 1 + (s + 1) * x * x * x + s * x * x; };
const seg = (t, a, b, e = sm) => e(cl((t - a) / (b - a)));
const muelle = (t, t0, A, f = 14, d = 6) => t < t0 ? 0 : A * Math.sin((t - t0) * f) * Math.exp(-(t - t0) * d);
const D = Math.PI / 180;
function rnd(i) { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function shade(hex, f) { const c = new THREE.Color(hex); c.multiplyScalar(f); return "#" + c.getHexString(); }

// ============================== texturas pixel (dibujadas a mano por código, 8x8 / 16x16)
function tex(w, h, fn, seed = 1) {

  const px = (x, y, col) => { g.fillStyle = col; g.fillRect(x, y, 1, 1); };
  fn(px, w, h, (x, y) => rnd(seed * 997 + x * 31 + y * 17));
  const t = new THREE.CanvasTexture(c); t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.colorSpace = THREE.SRGBColorSpace; t.generateMipmaps = false; return t;
}
const fill = (px, w, h, col, r, v = 0.08) => { for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) px(x, y, shade(col, 1 - v + 2 * v * r(x, y))); };
const M = t => new THREE.MeshLambertMaterial({ map: t });

// bloques del mundo
const T = {
  hierbaTop: tex(16, 16, (px, w, h, r) => { fill(px, w, h, "#5f9e3a", r, 0.14); for (let k = 0; k < 18; k++) px(Math.floor(r(k, 1) * 16), Math.floor(r(1, k) * 16), "#7fbf4a"); }, 2),
  hierbaLado: tex(16, 16, (px, w, h, r) => { fill(px, w, h, "#7a5532", r, 0.14); for (let x = 0; x < 16; x++) { const d = 3 + Math.floor(r(x, 9) * 3); for (let y = 0; y < d; y++) px(x, y, shade("#5f9e3a", 0.9 + 0.2 * r(x, y))); } for (let k = 0; k < 10; k++) px(Math.floor(r(k, 4) * 16), 6 + Math.floor(r(4, k) * 10), "#5e4026"); }, 3),
  tierra: tex(16, 16, (px, w, h, r) => { fill(px, w, h, "#7a5532", r, 0.16); }, 4),
  marmol: tex(16, 16, (px, w, h, r) => { fill(px, w, h, "#e8e2d4", r, 0.05); for (let k = 0; k < 16; k++) { px(k, Math.floor(8 + 4 * Math.sin(k * 0.7)), "#c9c0ad"); } px(3, 3, "#d6cfbf"); px(11, 12, "#d6cfbf"); }, 5),
  columna: tex(16, 16, (px, w, h, r) => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) px(x, y, shade(x % 4 === 0 ? "#cfc7b4" : "#ece6d8", 1 - 0.04 + 0.08 * r(x, y))); }, 6),
  oro: tex(16, 16, (px, w, h, r) => { fill(px, w, h, "#d9a630", r, 0.1); for (let x = 0; x < 16; x++) { px(x, 0, "#f3d26a"); px(x, 15, "#9a7020"); } }, 7),
  madera: tex(16, 16, (px, w, h, r) => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) px(x, y, shade(y % 4 === 0 ? "#6b4424" : "#9a6a3c", 1 - 0.07 + 0.14 * r(x, y))); }, 8),
  piedra: tex(16, 16, (px, w, h, r) => { fill(px, w, h, "#8a8780", r, 0.15); for (let k = 0; k < 8; k++) px(Math.floor(r(k, 2) * 16), Math.floor(r(2, k) * 16), "#6d6a64"); }, 9),
  muroNoche: tex(16, 16, (px, w, h, r) => { for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) { const m = y % 8 === 0 || (x + (Math.floor(y / 8) % 2) * 8) % 16 === 0; px(x, y, m ? "#4a4038" : shade("#8a7560", 1 - 0.08 + 0.16 * r(x, y))); } }, 10),
  tela: tex(16, 16, (px, w, h, r) => { fill(px, w, h, "#e9dcc0", r, 0.05); for (let x = 0; x < 16; x += 4) for (let y = 0; y < 16; y++) px(x, y, "#d4c4a2"); }, 11),
  nube: tex(8, 8, (px, w, h, r) => fill(px, w, h, "#ffffff", r, 0.03), 12),
};
const MAT = {
  hierba: [M(T.hierbaLado), M(T.hierbaLado), M(T.hierbaTop), M(T.tierra), M(T.hierbaLado), M(T.hierbaLado)],
  marmol: M(T.marmol), columna: M(T.columna), oro: M(T.oro), madera: M(T.madera), piedra: M(T.piedra), muro: M(T.muroNoche), tela: M(T.tela),

};

// ============================== pieles propias (skins) — se pintan cara a cara

function skin(sp) {
  const R = (x, y, s) => rnd(s * 101 + x * 7 + y * 13);

    fill(px, 8, 8, sp.piel, r, 0.05);
    if (sp.melena) { for (let x = 0; x < 8; x++) { px(x, 0, sp.pelo); px(x, 1, sp.pelo); } px(0, 2, sp.pelo); px(7, 2, sp.pelo); px(0, 3, sp.pelo); px(7, 3, sp.pelo); px(0, 4, sp.pelo); px(7, 4, sp.pelo); }
    else for (let x = 0; x < 8; x++) { px(x, 0, sp.pelo); if (x < 2 || x > 5 || sp.flequillo) px(x, 1, sp.pelo); }
    if (sp.leon) { for (let x = 0; x < 8; x++) { px(x, 0, "#c48a2c"); px(x, 1, x % 3 ? "#d9a03c" : "#a66f22"); } px(1, 1, "#2a1a0a"); px(6, 1, "#2a1a0a"); px(0, 2, "#c48a2c"); px(7, 2, "#c48a2c"); }
    if (sp.corona) { px(1, 0, "#f2c84a"); px(3, 0, "#f2c84a"); px(4, 0, "#f2c84a"); px(6, 0, "#f2c84a"); }
    // ojos y cejas según expresión

    if (expr === "cerrados" || expr === "risa") { px(1, 4, shade(sp.piel, 0.6)); px(2, 4, shade(sp.piel, 0.6)); px(5, 4, shade(sp.piel, 0.6)); px(6, 4, shade(sp.piel, 0.6)); }
    else { px(1, 4, ojoW); px(2, 4, pupila); px(5, 4, pupila); px(6, 4, ojoW); px(1, 3, shade(sp.piel, 0.82)); px(6, 3, shade(sp.piel, 0.82)); }
    if (expr === "enfado") { px(1, 3, "#2a1a0a"); px(2, 3, shade(sp.piel, 0.7)); px(6, 3, "#2a1a0a"); px(5, 3, shade(sp.piel, 0.7)); px(2, 2, "#2a1a0a"); px(5, 2, "#2a1a0a"); }
    else if (expr === "susto") { px(1, 3, shade(sp.pelo, 1)); px(6, 3, shade(sp.pelo, 1)); }
    // nariz
    px(3, 5, shade(sp.piel, 0.85)); px(4, 5, shade(sp.piel, 0.85));
    if (sp.barba) { for (let x = 1; x < 7; x++) { px(x, 6, sp.barba); px(x, 7, sp.barba); } px(0, 5, sp.barba); px(7, 5, sp.barba); px(0, 6, sp.barba); px(7, 6, sp.barba); }
    // boca
    const mc = "#6b2a22";
    if (expr === "risa") { px(2, 6, mc); px(3, 7, mc); px(4, 7, mc); px(5, 6, mc); px(3, 6, "#ffffff"); px(4, 6, "#ffffff"); }
    else if (expr === "grito") { px(3, 6, mc); px(4, 6, mc); px(3, 7, mc); px(4, 7, mc); }
    else if (expr === "enfado") { px(2, 7, mc); px(3, 6, mc); px(4, 6, mc); px(5, 7, mc); }
    else if (!sp.barba) { px(3, 6, mc); px(4, 6, mc); }
    else { px(3, 6, mc); px(4, 6, mc); }
  }, sp.seed);
  const pelo = tex(8, 8, (px, w, h, r) => { fill(px, 8, 8, sp.leon ? "#c48a2c" : sp.pelo, r, 0.12); if (sp.leon) for (let k = 0; k < 10; k++) px(Math.floor(r(k, 3) * 8), Math.floor(r(3, k) * 8), "#a66f22"); }, sp.seed + 1);
  const lado = tex(8, 8, (px, w, h, r) => { fill(px, 8, 8, sp.piel, r, 0.05); for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { if (y < 2 || (x > 4 && y < (sp.melena ? 8 : 5)) || (sp.leon && (y < 3 || x > 3))) px(x, y, shade(sp.leon ? "#c48a2c" : sp.pelo, 0.9 + 0.2 * r(x, y))); } if (sp.barba) for (let y = 5; y < 8; y++) for (let x = 0; x < 3; x++) px(x, y, sp.barba); px(2, 4, shade(sp.piel, 0.8)); }, sp.seed + 2);
  const ladoR = tex(8, 8, (px, w, h, r) => { fill(px, 8, 8, sp.piel, r, 0.05); for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) { if (y < 2 || (x < 3 && y < (sp.melena ? 8 : 5)) || (sp.leon && (y < 3 || x < 4))) px(x, y, shade(sp.leon ? "#c48a2c" : sp.pelo, 0.9 + 0.2 * r(x, y))); } if (sp.barba) for (let y = 5; y < 8; y++) for (let x = 5; x < 8; x++) px(x, y, sp.barba); px(5, 4, shade(sp.piel, 0.8)); }, sp.seed + 3);
  const ropa = (w, h, fn, s) => tex(w, h, (px, W, H, r) => { fill(px, W, H, sp.ropa, r, 0.07); fn && fn(px, W, H, r); }, s);
  const torsoF = ropa(8, 12, (px, w, h, r) => {
    if (sp.cinto) for (let x = 0; x < 8; x++) px(x, 7, sp.cinto);
    if (sp.escote) { px(3, 0, sp.piel); px(4, 0, sp.piel); px(3, 1, sp.piel); px(4, 1, sp.piel); }
    if (sp.leon) { for (let x = 0; x < 8; x++) { px(x, 0, "#c48a2c"); px(x, 1, x % 2 ? "#d9a03c" : "#b07a26"); } px(0, 2, "#c48a2c"); px(7, 2, "#c48a2c"); px(3, 2, "#d9a03c"); px(4, 2, "#d9a03c"); px(3, 3, "#8a5a1a"); px(4, 3, "#8a5a1a"); }
    if (sp.desnudo) for (let y = 0; y < 7; y++) for (let x = 0; x < 8; x++) px(x, y, shade(sp.piel, 0.95 + 0.1 * r(x, y)));
    if (sp.ribete) for (let x = 0; x < 8; x++) px(x, 11, sp.ribete);
  }, sp.seed + 4);
  const torsoB = ropa(8, 12, (px, w, h, r) => { if (sp.leon) for (let y = 0; y < 9; y++) for (let x = 1; x < 7; x++) px(x, y, shade("#c48a2c", 0.85 + 0.25 * r(x, y))); if (sp.melena) for (let y = 0; y < 5; y++) for (let x = 1; x < 7; x++) px(x, y, sp.pelo); if (sp.cinto) for (let x = 0; x < 8; x++) px(x, 7, sp.cinto); }, sp.seed + 5);
  const torsoL = ropa(4, 12, (px, w, h, r) => { if (sp.cinto) for (let x = 0; x < 4; x++) px(x, 7, sp.cinto); }, sp.seed + 6);
  const brazoU = tex(4, 6, (px, w, h, r) => { fill(px, 4, 6, sp.mangas ? sp.ropa : sp.piel, r, 0.06); if (sp.brazalete) for (let x = 0; x < 4; x++) px(x, 4, sp.brazalete); }, sp.seed + 7);
  const brazoL = tex(4, 6, (px, w, h, r) => { fill(px, 4, 6, sp.piel, r, 0.06); if (sp.brazalete) for (let x = 0; x < 4; x++) px(x, 1, sp.brazalete); }, sp.seed + 8);
  const mano = tex(4, 4, (px, w, h, r) => fill(px, 4, 4, shade(sp.piel, 0.92), r, 0.05), sp.seed + 9);
  const piernaU = tex(4, 6, (px, w, h, r) => fill(px, 4, 6, sp.falda ? sp.ropa : (sp.pantalon || sp.piel), r, 0.07), sp.seed + 10);
  const piernaL = tex(4, 6, (px, w, h, r) => { fill(px, 4, 6, sp.faldaLarga ? sp.ropa : sp.piel, r, 0.06); if (!sp.faldaLarga) { for (let x = 0; x < 4; x++) { px(x, 5, sp.sandalia || "#6b4424"); px(x, 3, sp.sandalia || "#6b4424"); } } }, sp.seed + 11);
  const pie = tex(4, 4, (px, w, h, r) => fill(px, 4, 4, sp.faldaLarga ? sp.ropa : (sp.sandalia || "#6b4424"), r, 0.08), sp.seed + 12);
  const caras = {}; for (const e of ["normal", "enfado", "risa", "cerrados", "grito", "susto"]) caras[e] = M(caraTex(e));
  const mP = M(pelo), mL = M(lado), mR = M(ladoR);
  return {
    caras, cabeza: e => [mR, mL, mP, M(mano), caras[e] || caras.normal, mP],
    torso: [M(torsoL), M(torsoL), M(torsoL), M(torsoL), M(torsoF), M(torsoB)],
    brazoU: M(brazoU), brazoL: M(brazoL), mano: M(mano), piernaU: M(piernaU), piernaL: M(piernaL), pie: M(pie),
  };
}
// ============================== rig (proporciones de bloque: cabeza 8, torso 8x12x4, brazos y piernas 4x12x4 en dos tramos)
function caja(w, h, d, mat, x = 0, y = 0, z = 0) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; return m; }
function personaje(sp, escala = 1) {
  const S = skin(sp), root = new THREE.Group(), cad = new THREE.Group(); root.add(cad); cad.position.y = 12;
  const torso = new THREE.Group(); cad.add(torso);
  torso.add(caja(8, 12, 4, S.torso, 0, 6, 0));
  if (sp.faldaLarga) torso.add(caja(9, 7, 5, S.torso, 0, -3, 0));
  const cuello = new THREE.Group(); cuello.position.y = 12; torso.add(cuello);
  const cabeza = caja(8, 8, 8, S.cabeza("normal"), 0, 4, 0); cuello.add(cabeza);
  if (sp.leon) { const melena = caja(10, 4, 9.6, M(T.oro), 0, 8.4, -0.6); melena.material = M(tex(8, 8, (px, w, h, r) => fill(px, 8, 8, "#c48a2c", r, 0.18), 77)); cuello.add(melena);
    const oreja1 = caja(2, 2, 2, melena.material, -3.6, 10.8, 1), oreja2 = caja(2, 2, 2, melena.material, 3.6, 10.8, 1); cuello.add(oreja1, oreja2); }
  if (sp.corona) { for (const [x, z] of [[-3, 3], [0, 3.4], [3, 3], [-3.4, 0], [3.4, 0], [-3, -3], [0, -3.4], [3, -3]]) cuello.add(caja(1.6, 2.4, 1.6, MAT.oro, x, 9.2, z)); cuello.add(caja(8.6, 1, 8.6, MAT.oro, 0, 8.2, 0)); }
  if (sp.melena) cuello.add(caja(8.6, 9, 2, M(tex(8, 8, (px, w, h, r) => fill(px, 8, 8, sp.pelo, r, 0.12), 78)), 0, 3, -4.4));
  const mk = (lado) => {
    const sh = new THREE.Group(); sh.position.set(lado * 6, 10, 0); torso.add(sh);
    sh.add(caja(4, 6, 4, S.brazoU, 0, -3, 0));
    const el = new THREE.Group(); el.position.y = -6; sh.add(el);
    el.add(caja(3.9, 5, 3.9, S.brazoL, 0, -2.5, 0)); el.add(caja(4.1, 1.6, 4.1, S.mano, 0, -5.6, 0));
    return { sh, el };
  };
  const mkL = (lado) => {
    const hp = new THREE.Group(); hp.position.set(lado * 2, 0, 0); cad.add(hp);
    hp.add(caja(4, 6, 4, S.piernaU, 0, -3, 0));
    const kn = new THREE.Group(); kn.position.y = -6; hp.add(kn);
    kn.add(caja(3.9, 5, 3.9, S.piernaL, 0, -2.5, 0)); kn.add(caja(4.1, 1.2, 5, S.pie, 0, -5.4, 0.5));
    return { hp, kn };
  };
  const aR = mk(-1), aL = mk(1), lR = mkL(-1), lL = mkL(1);
  root.scale.setScalar(escala);
  return { root, cad, torso, cuello, cabeza, aR, aL, lR, lL, S, expr: "normal" };
}
function cara(ch, e) { if (ch.expr !== e) { ch.cabeza.material = ch.S.cabeza(e); ch.expr = e; } }
// pose: p = {x,y,z,ry, lean, giro, cabX, cabY, cabZ, bR:[x,z], bL, cR, cL, pR, pL, kR, kL, andar(fase), amp, salto, sq}
function pose(ch, p, t) {
  const A = p.amp || 0, ph = p.andar || 0;
  const sw = Math.sin(ph) * A, bob = Math.abs(Math.sin(ph)) * 1.2 * A;
  const resp = Math.sin(t * 2.4 + (p.seed || 0)) * 0.012;
  ch.root.position.set(p.x || 0, (p.y || 0) + (p.salto || 0) + bob, p.z || 0);
  ch.root.rotation.y = (p.ry || 0) * D;
  ch.cad.rotation.set(0, (p.giro || 0) * D, 0);
  ch.torso.rotation.set(((p.lean || 0) + sw * 3) * D, Math.sin(ph) * 6 * A * D, (p.ladeo || 0) * D);
  ch.torso.scale.set(1, 1 + resp + ((p.sq || 1) - 1), 1);
  ch.cuello.rotation.set((p.cabX || 0) * D, (p.cabY || 0) * D, (p.cabZ || 0) * D);
  const b = (arm, bx, bz, c, s) => { arm.sh.rotation.set((bx + s) * D, 0, bz * D); arm.el.rotation.set(-c * D, 0, 0); };
  b(ch.aR, (p.bR ? p.bR[0] : 0), (p.bR ? p.bR[1] : 0) - 4, p.cR ?? 8 + 6 * A, sw * 38);
  b(ch.aL, (p.bL ? p.bL[0] : 0), (p.bL ? p.bL[1] : 0) + 4, p.cL ?? 8 + 6 * A, -sw * 38);
  const l = (leg, a, k) => { leg.hp.rotation.set(a * D, 0, 0); leg.kn.rotation.set(k * D, 0, 0); };
  l(ch.lR, (p.pR || 0) - sw * 34, (p.kR || 0) + Math.max(0, Math.sin(ph + 1.4)) * 40 * A);
  l(ch.lL, (p.pL || 0) + sw * 34, (p.kL || 0) + Math.max(0, Math.sin(ph + 1.4 + Math.PI)) * 40 * A);
}
// ============================== escena
const W = 1920, H = 1080;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(40, W / H, 1, 3000);
const hemi = new THREE.HemisphereLight("#cfe6ff", "#6b5a3a", 1.1); scene.add(hemi);
const sol = new THREE.DirectionalLight("#fff1d8", 2.6); sol.castShadow = true; sol.shadow.mapSize.set(2048, 2048);
Object.assign(sol.shadow.camera, { left: -160, right: 160, top: 160, bottom: -160, near: 1, far: 900 }); sol.shadow.bias = -0.0006; sol.shadow.normalBias = 0.6;
scene.add(sol, sol.target);
const vela = new THREE.PointLight("#ffb050", 0, 260, 1.6); vela.castShadow = true; vela.shadow.mapSize.set(1024, 1024); scene.add(vela);
const cieloC = document.createElement("canvas"); cieloC.width = 2; cieloC.height = 256; const cieloT = new THREE.CanvasTexture(cieloC); cieloT.colorSpace = THREE.SRGBColorSpace;
function cielo(a, b) { const g = cieloC.getContext("2d"), gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, a); gr.addColorStop(1, b); g.fillStyle = gr; g.fillRect(0, 0, 2, 256); cieloT.needsUpdate = true; scene.background = cieloT; }
scene.fog = new THREE.Fog("#cfe6ff", 260, 1100);
const BL = 16;
function suelo(cx, cz, n, mat, y = 0) {
  const g = new THREE.BoxGeometry(BL, BL, BL), im = new THREE.InstancedMesh(g, mat, n * n); const m = new THREE.Matrix4(); let k = 0;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { const h = Math.floor(rnd(i * 53 + j * 7 + cx) * 1.15); m.makeTranslation(cx + (i - n / 2) * BL, y - BL / 2 + (mat === MAT.hierba ? h * 0 : 0), cz + (j - n / 2) * BL); im.setMatrixAt(k++, m); }
